<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SectorBoost公式サイトに埋め込むための売上課題簡易診断ツール"
    />
    <title>SectorBoost 売上課題診断</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="sb-page" id="sectorboost-diagnosis">
      <section class="diagnosis" aria-labelledby="diagnosis-title">
        <div class="diagnosis__header">
          <p class="eyebrow">SectorBoost Diagnosis</p>
          <h1 id="diagnosis-title">売上が伸びない原因を5問で見える化</h1>
          <p class="lead">
            現在の集客・営業導線をかんたんに確認し、優先して整えるべき課題と改善の方向性を診断します。
          </p>
        </div>

        <noscript>
          <p class="noscript-message">
            診断ツールを利用するには、ブラウザのJavaScriptを有効にしてください。
          </p>
        </noscript>

        <div class="diagnosis__card" id="diagnosis-app">
          <div class="progress" aria-label="診断の進捗">
            <div class="progress__meta">
              <span id="progress-label">質問 1 / 5</span>
              <span id="progress-percent">0%</span>
            </div>
            <div class="progress__track" aria-hidden="true">
              <span class="progress__bar" id="progress-bar"></span>
            </div>
          </div>

          <div class="screen screen--active" id="question-screen">
            <p class="question__tag" id="question-tag">集客</p>
            <h2 class="question__title" id="question-title">
              現在、安定して新規の問い合わせを獲得できていますか？
            </h2>
            <div
              class="answers"
              id="answers"
              role="group"
              aria-labelledby="question-title"
            ></div>
          </div>

          <div class="screen" id="result-screen" aria-live="polite">
            <p class="result__label">診断結果</p>
            <h2 class="result__title" id="result-title"></h2>
            <p class="result__summary" id="result-summary"></p>

            <div class="result__grid">
              <article class="result-box">
                <span class="result-box__number">01</span>
                <h3>現在の課題</h3>
                <p id="result-issue"></p>
              </article>
              <article class="result-box">
                <span class="result-box__number">02</span>
                <h3>改善の方向性</h3>
                <p id="result-direction"></p>
              </article>
              <article class="result-box">
                <span class="result-box__number">03</span>
                <h3>SectorBoostでできること</h3>
                <p id="result-support"></p>
              </article>
            </div>

            <div class="cta-panel" id="contact">
              <p>診断結果をもとに、貴社の売上導線を具体的に整理しませんか。</p>
              <a
                class="cta-button"
                href="#contact"
                aria-label="SectorBoostに無料相談する"
              >
                無料相談を申し込む
              </a>
              <button
                class="secondary-button"
                type="button"
                id="restart-button"
              >
                もう一度診断する
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
